name: Check gitignore files on PR commit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-ignored:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Check ignored files
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          IGNORED=$(echo "$FILES" | xargs -I {} git check-ignore {} || true)

          if [ -n "$IGNORED" ]; then
            echo "❌ Error: The following ignored files are in this PR:"
            echo "$IGNORED"
            exit 1
          fi

          echo "✅ No ignored files found"
