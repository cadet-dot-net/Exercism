name: Check gitignore is respected in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  check-ignored:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ignored files
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Files in PR:"
          echo "$FILES"
          echo ""
          echo "Checking against gitignore..."

          IGNORED=$(echo "$FILES" | git check-ignore --stdin || true)

          echo "Ignored files found:"
          echo "$IGNORED"

          if [ -n "$IGNORED" ]; then
            echo "❌ Error: PR contains ignored files"
            exit 1
          fi

          echo "✅ No ignored files found"
