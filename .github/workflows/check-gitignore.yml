name: Check gitignore is respected in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  check-ignored:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ignored files
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          IGNORED=$(echo "$FILES" | git check-ignore --no-index --stdin || true)

          if [ -n "$IGNORED" ]; then
            echo "❌ PR contains files that go against gitignore:"
            echo "$IGNORED" > ignored-files.txt
            exit 1
          fi

          echo "✅ No ignored files found"

      - name: Upload ignored files list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ignored-files-list
          path: ignored-files.txt

  remove-ignored-files:
    runs-on: ubuntu-latest
    needs: check-ignored
    if: failure()
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ignored files list
        uses: actions/download-artifact@v4
        with:
          name: ignored-files-list

      - name: Remove ignored files
        run: |
          if [ -f ignored-files.txt ]; then
            echo "Removing ignored files:"
            cat ignored-files.txt
            cat ignored-files.txt | xargs git rm --cached

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove ignored files from PR"
            git push
          fi
