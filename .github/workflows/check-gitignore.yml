name: Check gitignore files are not committed

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  check-ignored:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ignored files
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          IGNORED=$(echo "$FILES" | git check-ignore --no-index --stdin || true)

          if [ -n "$IGNORED" ]; then
            echo "❌ PR contains files that go against gitignore:"
            echo "$IGNORED" > ignored-files.txt
            exit 1
          fi

          echo "✅ No ignored files found"

      - name: Upload ignored files list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ignored-files-list
          path: ignored-files.txt
