name: Check gitignore is respected in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  check-ignored:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ignored files
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$FILES" | git check-ignore --stdin; then
            echo "❌ Error: PR contains ignored files (listed above)"
            exit 1
          fi

          echo "✅ No ignored files found"
