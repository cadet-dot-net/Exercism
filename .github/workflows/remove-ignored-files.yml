name: Remove ignored files

on:
  workflow_run:
    workflows: ["Check gitignore is respected in PRs"]
    types: [completed]
  # enable "Run workflow" button in UI for manual triggering
  workflow_dispatch:

jobs:
  remove-ignored-files:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ignored files list
        uses: actions/download-artifact@v4
        with:
          name: ignored-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Remove ignored files
        run: |
          if [ -f ignored-files.txt ]; then
            echo "🗑️ Removing ignored files:"
            cat ignored-files.txt
            cat ignored-files.txt | xargs git restore --source=HEAD

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove ignored files from PR"
            git push
          fi
